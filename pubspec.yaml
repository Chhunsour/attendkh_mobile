name: attendkh
description: "AttendKH Mobile App - Smart Attendance & Payroll"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fluttertoast: ^9.1.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.3

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Device
  device_info_plus: ^11.5.0
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  url_launcher: ^6.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Location & Camera
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Utilities
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  logger: ^2.5.0
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  flutter_image_compress: ^2.4.0
  table_calendar: ^3.2.0
  device_marketing_names: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  mockito: ^5.4.5
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/images/flag_km.svg
    - assets/images/flag_en.svg

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-Thin.ttf
          weight: 100
        - asset: assets/fonts/GoogleSansFlex-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/GoogleSansFlex-Light.ttf
          weight: 300
        - asset: assets/fonts/GoogleSansFlex-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlex-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSansFlex-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/GoogleSansFlex-Black.ttf
          weight: 900
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 100
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 200
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 300
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/GoogleSans-MediumItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 800
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 900
        - asset: assets/fonts/GoogleSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/GoogleSans-BoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/GoogleSans-BoldItalic.ttf
          weight: 900
          style: italic
    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro-Thin.ttf
          weight: 100
        - asset: assets/fonts/KantumruyPro-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/KantumruyPro-Light.ttf
          weight: 300
        - asset: assets/fonts/KantumruyPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/KantumruyPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/KantumruyPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/KantumruyPro-Bold.ttf
          weight: 700
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKhmer-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKhmer-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKhmer-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/attendkh_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/attendkh_logo.png"
  macos:
    generate: true
    image_path: "assets/images/attendkh_logo.png"